<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <title>GNIP AR Test</title>

<!-- bootstrap -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- A-Frame + Extras -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

    <!-- Stats.js for MindAR debug overlay -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/stats.js/build/stats.min.js"></script>

    <!-- MindAR Image Tracking for A-Frame -->

    <!-- bvh file loader 
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #debug-box {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 10px 15px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        max-width: 350px;
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #00ff00;
        border-radius: 6px;
      }
      #debug-box div { margin: 2px 0; }

      #custom-loader {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #custom-loader img {
        width: 180px;
        height: auto;
      }

      a-scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Make container full width for mobile */
  #custom-loader {
    width: 100%;
    max-width: 640px; /* optional max width */
    margin: 0 auto;   /* center */
  }

  /* Make video fill container and keep aspect ratio */
  #myVideo {
    width: 100%;
    height: auto;
    display: block;
  }

    </style>
  </head>

  <body>
    <div class="container">
    <div id="debug-box"></div>
    <audio id="narrator" src="./resources/sound/6_Narrator_1.mp3"></audio>

    <audio id="sammy" src="./resources/sound/7_Sammy_1.mp3"></audio>
</div>
  <script type="module" src="./js/main.js"></script>
  </body>
</html>
