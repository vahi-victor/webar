<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <title>GNIP AR Test</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
<!-- bootstrap -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- A-Frame + Extras -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

    <!-- Stats.js for MindAR debug overlay -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/stats.js/build/stats.min.js"></script>

    <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- bvh file loader 
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/loaders/BVHLoader.js"></script>-->

    <style>
      body { margin: 0; overflow: hidden; }
      #debug-box {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 10px 15px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        max-width: 350px;
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #00ff00;
        border-radius: 6px;
      }
      #debug-box div { margin: 2px 0; }

      #custom-loader {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #custom-loader img {
        width: 180px;
        height: auto;
      }

      a-scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Make container full width for mobile */
  #custom-loader {
    width: 100%;
    max-width: 640px; /* optional max width */
    margin: 0 auto;   /* center */
  }

  /* Make video fill container and keep aspect ratio */
  #myVideo {
    width: 100%;
    height: auto;
    display: block;
  }

    </style>
  </head>

  <body>
    <div class="container">
  <!-- Custom loader -->
      <div id="custom-loader" class="col-sm-4">
        <video id="myvideo"  autoplay muted playsinline>
            <source src="./resources/Logo.mp4" type="video/mp4">
        </video>
      </div>

    <!-- Debug Console -->
    <div id="debug-box" style="display:block;">
      <strong>Debug Console:</strong>
    </div>

    <audio id="narrator" src="./resources/sound/6_Narrator_1.mp3"></audio>

    <audio id="sammy" src="./resources/sound/7_Sammy_1.mp3"></audio>
</div>
    

    <!-- AR Scene -->
    <a-scene
      id="scene"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0005; filterBeta: 0.1; showStats: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"    
      loading-screen="enabled: false">

      <!-- دوربین -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- نور محیط -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>

      <!-- منابع مدل‌ها 
      <a-assets>
        <a-asset-item id="minecraft" src="assets/minecraft.glb"></a-asset-item>
        <a-asset-item id="squirrle" src="resources/sq-multi.glb"></a-asset-item>
        <a-asset-item id="tree" src="resources/tree.glb"></a-asset-item>
         <a-asset-item id="phoenix" src="resources/phoenix_bird.glb"></a-asset-item>
      </a-assets>-->


      <a-entity mindar-image-target="targetIndex: 0"; id="target0">
        <!-- مدل Minecraft 
        <a-entity
          id="test"
          class="clickable"
          gltf-model="#minecraft"
          position="-0.1 -0.2 -0.3"
          rotation="-30 180 0"
          scale="0.1 0.1 0.1"
          rotation="0 180 0"
          animation__front="property: position; to:0 -0.2 3; dur: 11000; dir: alternate; startEvents: movefrontmine"
          animation__scale="property: scale; to:0.1 0.1 0.1; dur: 11000; dir: alternate; startEvents: scalemine"
          >
        </a-entity>-->

        <!-- مدل Squirrel 
        <a-entity
          id="t2"
          class="clickable"
          gltf-model="#squirrle"
          position="-0.23 -0.38 0"
          rotation="5.354 70 12.784"
          scale=" 1.1 1.1 1.1"        
          animation__right="property: position; to: 0.27 -0.4 0; dur: 18000; startEvents: moveright"
          animation__front="property: rotation; to:5.354 0 13; dur: 8000; dir: alternate; startEvents: movefront">
        </a-entity>-->

        <!-- tree model
        <a-entity
          id="t1"
          gltf-model="#tree"
          position="0.2 -0.4 0"
          rotation="0 290 0"
          scale="0.3 0.5 0.3">
        </a-entity> -->

        <!-- phoenix_bird 
         <a-entity 
          id="phoenix_bird"
          gltf-model="#phoenix"
          position=" -1 0.3 2"
          scale="0.0004 0.0004 0.0004"
          rotation="0 45 0"
          animation-mixer
          animation__fly="property: position; to:0.1 0.4 -0.9; dur:12000; loop: false; startEvents: flying"
          animation__flyfront="property: position; to:0.1 0.4 -0.09; dur:12000; resumeEvents; startEvents:flyingfront"
          animation__flyrotate="property: rotation; to:0 0 0; dur:1000; resumeEvents; startEvents:phoenixrotation"
          animation__flyscal="property: scale; to :0.0005 0.0005 0.0005; dur:18000; resumeEvents; startEvents:phoenixscale"></a-entity>-->

      </a-entity>

    </a-scene>

    <script>
      
      // ---------- Debug Logger ----------
      const debugBox = document.getElementById("debug-box");
      function debugLog(msg) {
        console.log(msg);
        const div = document.createElement("div");
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        debugBox.appendChild(div);
        debugBox.scrollTop = debugBox.scrollHeight;
  
      }
      const video = document.querySelector("#myvideo");
      setTimeout(() =>{
        video.play();
      }, 4000);


      // murl
      const params = new URLSearchParams(window.location.search);
      const value = params.get("urll");
      debugLog(value);


      // ---------- Scene Setup ----------
      const sceneEl = document.querySelector("#scene");

      sceneEl.addEventListener("loaded", () =>{
        debugLog("Scene loaded. Setting up raycaster...");
        
          const target0=document.querySelector("#target0");

          const camera = sceneEl.camera;
          const raycaster = new THREE.Raycaster();
          const mouse = new THREE.Vector2();

          // 1️⃣ Get dynamic model URL (example: query param ?modelUrl=...)
          const params = new URLSearchParams(window.location.search);
          const mUrl = params.get("murl") || "resources/sq-multi.glb";

          // load modeles in js 
          const models=[
            {
              id:"phoenix_bird",
              src:'resources/phoenix_bird.glb',
              position:" 0 0.3 3",
              scale:"0.0006 0.0006 0.0006",
              rotation:"0 60 0",
              "animation-mixer": "clip: *",
              Animation:[
                {name:"fly", value:"property: position; to:0 0.2 -1.8; dur:13000; loop: false; startEvents: flying"},
                {name:"flyfront", value:"property: position; to:4 0.4 -1.8; dur:12000; resumeEvents; startEvents:flyingfront"},
                {name:"flyrotate", value:"property: rotation; to:0 0 0; dur:1000; resumeEvents; startEvents:phoenixrotation"},
                {name:"flyscale", value:"property: position; to :2 0.4 -0.09; dur:8000; resumeEvents; startEvents:phoenixscale"},
              ]
            },

            {
              id:"t2",
              class:"clickable",
              src: mUrl,
              position:"-0.32 -0.38 0",
              rotation:"5.354 70 12.784",
              scale:" 1.1 1.1 1.1",
              Animation:[
              {name:"right", value :"property: position; to: 0.27 -0.4 0; dur: 12000; startEvents: moveright"},
              {name:"front", value:"property: rotation; to:5.354 0 13; dur: 8000; dir: alternate; startEvents: movefront"},
              ]
            },

            {
              id:"t1",
              src:'resources/tree.glb',
              position:"0.25 -0.4 0",
              rotation:"0 290 0",
              scale:"0.2 0.4 0.3",
            },
          ];

          models.forEach(item =>{
            const entity = document.createElement("a-entity");

            entity.setAttribute("id",item.id);
            entity.setAttribute("gltf-model",item.src);
            entity.setAttribute("class",item.class);
            entity.setAttribute("position",item.position);
            entity.setAttribute("rotation",item.rotation);
            entity.setAttribute("scale",item.scale);

            if (item["animation-mixer"]) {
              entity.setAttribute("animation-mixer", item["animation-mixer"]);
            }

            if (item.Animation && Array.isArray(item.Animation)) {
              item.Animation.forEach(anim => {
                entity.setAttribute(`animation__${anim.name}`, anim.value);
              });
            }

            target0.appendChild(entity);
            console.log("Model created:", entity);
            });

            // مدل‌ها
            
            const squirrel = document.querySelector("#t2");
            const tree1 = document.querySelector("#t1");
            const phoenix = document.querySelector("#phoenix_bird");

            
            const clipsq = ["rig|idle-1", "rig|walk-03_remap"];

            let index = 0;
            let moveIndex = 0;

            // tree model moded log
            tree1.addEventListener("model-loaded", () => {
              debugLog("tree model loaded");
            });

            

            phoenix.setAttribute('visible', 'false');
            debugLog("phoenix visible is false");

            // play when marker found
            const marker = document.querySelector("#target0");
            marker.addEventListener("targetFound", () => {
              debugLog("target founded");
              const sound = document.getElementById('narrator');
              sound.volume = 1;
              setTimeout(() => {
                sound.play();
              }, 8000);
              debugLog("Narration is palying");
              // visible phoenix and fly
              phoenix.setAttribute('visible', 'true');
              debugLog("phoenix model loaded");
              phoenix.emit("flying");
              debugLog("Phoenix flying started");
            });

            // squirrel model
            squirrel.addEventListener("model-loaded", ()=> {
              document.querySelector('#custom-loader').style.display = "none";
              squirrel.setAttribute("animation-mixer", "clip: rig|idle-1");
              debugLog("squirrell model loaded");
              
            });
            
            phoenix.addEventListener("animationcomplete__fly", () =>{
                debugLog("Phoenix finished first flight; Rotating");
                phoenix.emit("phoenixrotation");
                phoenix.emit("phoenixscale");
                debugLog("Phoenix finished first flight; switching to flyfront");
                phoenix.emit("flyingfront");
              });

            // ---------- تعامل کلیک/لمس ----------
            function handleInteraction(event) {
              const rect = sceneEl.canvas.getBoundingClientRect();
              const x = event.touches ? event.touches[0].clientX : event.clientX;
              const y = event.touches ? event.touches[0].clientY : event.clientY;

              mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
              mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

              raycaster.setFromCamera(mouse, camera);
              const intersects = raycaster.intersectObjects(sceneEl.object3D.children, true);

              if (intersects.length > 0) {
                const target = intersects[0].object.el;
                if (!target) return;
                debugLog(`Tapped: ${target.id}`);

                // Minecraft
                if (target.id === "test") {
                  index = (index + 1) % clips.length;
                  const clip = clips[index];
                  minecraft.setAttribute("animation-mixer", `clip: ${clip}`);
                  if (clip === "walk") {
                    minecraft.emit("movefrontmine");
                    minecraft.emit("scalemine");
                    debugLog("Minecraft → movefrontmine");
                  }
                  debugLog(`Minecraft animation: ${clip}`);
                }

                // squirrel
                if (target.id === "t2") { 
                  squirrel.setAttribute("animation-mixer", `clip:rig|walk-03_remap`,'timeScal:5');
                  squirrel.emit("moveright");
                  debugLog(`Minecraft animation: moveright`);
                  const sound = document.getElementById('sammy');
                  sound.volume = 1;
                  sound.play();
                  debugLog(`sammy is talking`);
                }

                squirrel.addEventListener("animationcomplete__right",()=>{
                  debugLog("animation move to right completed");
                  squirrel.setAttribute("animation__fade",{
                    property:"scale",
                    to:"0 0 0",
                    dur:3000,
                    easing: "easeInOutSine"
                  });
      
                  squirrel.addEventListener("animationcomplete__fade",()=>{
                    squirrel.parentNode.removeChild(squirrel);
                    debugLog("removed");
                  });
                });
              }
            }

            // فقط یک شنونده (تا دوبار اجرا نشود)
            sceneEl.addEventListener("click", handleInteraction);

            debugLog("Raycaster ready (click supported).");
          

        });
        
    </script>
  </body>
</html>
