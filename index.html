<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <title>GNIP AR Test</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- A-Frame + Extras -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

    <!-- Stats.js for MindAR debug overlay -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/stats.js/build/stats.min.js"></script>

    <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #debug-box {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 10px 15px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        max-width: 350px;
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #00ff00;
        border-radius: 6px;
      }
      #debug-box div { margin: 2px 0; }

      a-scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- Debug Console -->
    <div id="debug-box">
      <strong>Debug Console:</strong>
    </div>

    <!-- AR Scene -->
    <a-scene
      id="scene"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0005; filterBeta: 0.1; showStats: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"    >

      <!-- دوربین -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- نور محیط -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>

      <!-- منابع مدل‌ها -->
      <a-assets>
        <a-asset-item id="minecraft" src="assets/minecraft.glb"></a-asset-item>
        <a-asset-item id="squirrle" src="assets/rig_anim2.glb"></a-asset-item>
      </a-assets>


      <a-entity mindar-image-target="targetIndex: 0">
        <!-- مدل Minecraft -->
        <a-entity
          id="test"
          class="clickable"
          gltf-model="#minecraft"
          position="-0.363 -01 -5.265"
          rotation="-30 180 0"
          scale="0.3 0.3 0.3"
          rotation="0 180 0"
          animation__front="property: position; to:0.163 2.632 5.265; dur: 11000; dir: alternate; startEvents: movefrontmine"></a-entity>>
        </a-entity>

        <!-- مدل Squirrel -->
        <a-entity
          id="t2"
          class="clickable"
          gltf-model="#squirrle"
          position="0 0 0"
          rotation="5.354 34.967 12.784"
          scale="0.005 0.005 0.005"
          animation-mixer
          animation__right="property: position; to: 0.364 0.1 -1.304; dur: 10000; startEvents: moveright"
          animation__front="property: position; to:-0.364 0.1 -1.304; dur: 10000; dir: alternate; startEvents: movefront">
        </a-entity>

      </a-entity>

    </a-scene>

    <script>

      
      // ---------- Debug Logger ----------
      const debugBox = document.getElementById("debug-box");
      function debugLog(msg) {
        console.log(msg);
        const div = document.createElement("div");
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        debugBox.appendChild(div);
        debugBox.scrollTop = debugBox.scrollHeight;
      }

      debugLog("Script started");

      // ---------- Scene Setup ----------
      const sceneEl = document.querySelector("#scene");
      sceneEl.addEventListener("loaded", () => {
        debugLog("Scene loaded. Setting up raycaster...");

        const camera = sceneEl.camera;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // مدل‌ها
        const minecraft = document.querySelector("#test");
        const squirrel = document.querySelector("#t2");
        const clips = ["idle", "punch", "walk", "run"];
        let index = 0;
        let moveIndex = 0;

        // وقتی مدل Minecraft آماده شد
        minecraft.addEventListener("model-loaded", () => {
          minecraft.setAttribute("animation-mixer", "clip: idle");
          debugLog("Minecraft model loaded");
        });

        // ---------- تعامل کلیک/لمس ----------
        function handleInteraction(event) {
          const rect = sceneEl.canvas.getBoundingClientRect();
          const x = event.touches ? event.touches[0].clientX : event.clientX;
          const y = event.touches ? event.touches[0].clientY : event.clientY;

          mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(sceneEl.object3D.children, true);

          if (intersects.length > 0) {
            const target = intersects[0].object.el;
            if (!target) return;
            debugLog(`Tapped: ${target.id}`);

            // Minecraft
            if (target.id === "test") {
              index = (index + 1) % clips.length;
              const clip = clips[index];
              minecraft.setAttribute("animation-mixer", `clip: ${clip}`);
              if (clip === "walk") {
                minecraft.emit("movefrontmine");
                debugLog("Minecraft → movefrontmine");
              }
              debugLog(`Minecraft animation: ${clip}`);
            }

            // Squirrel
            if (target.id === "t2") {
              moveIndex++;
              if (moveIndex % 2 === 1) {
                squirrel.emit("moveright");
                debugLog("Squirrel → moveright");
              } else {
                squirrel.emit("movefront");
                debugLog("Squirrel → movefront");
              }
            }
          }
        }

        // فقط یک شنونده (تا دوبار اجرا نشود)
        sceneEl.addEventListener("click", handleInteraction);

        debugLog("Raycaster ready (click supported).");
      });
    </script>
  </body>
</html>
