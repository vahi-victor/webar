<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="utf-8" />
  <title>GNIP AR Test</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
     * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
.container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #debug-box {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      padding: 10px 15px;
      font-family: monospace;
      font-size: 11px;
      z-index: 9999;
      max-width: 320px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #00ff00;
      border-radius: 6px;
    }

    #debug-box div {
      margin: 2px 0;
    }

  </style>
</head>

<body>
  <div id="container">
    <div id="debug-box"></div>
  </div>
  

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.137.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
</script>

  <script type="module" src="/js/main.js"></script>
    

</body>

</html>
