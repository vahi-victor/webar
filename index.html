<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GNIP AR Test</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CSS style importing -->
    <link rel="stylesheet" href="style.css">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- AR liberaries CDN importing -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  </head>
  <body>
    <!-- Welcome screen -->
    <div id="welcome-screen">
      <div class="star" style="top: 10%; left: 10%;">⭐</div>
      <div class="star" style="top: 20%; right: 15%; animation-delay: 1s;">✨</div>
      <div class="star" style="bottom: 15%; left: 20%; animation-delay: 0.5s;">🌟</div>
      <div class="star" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">⭐</div>
      
      <h1>🌈 Welcome to Story Land! 🌈</h1>
      <button id="welcome-btn">✨ Start Adventure ✨</button>
    </div>

    <!-- Story content -->
    <div id="content">
      <div class="story-card">
        <div class="title">📖 The Jungle Tale</div>
        <p id="story" class="story">
          Im Wald, wo Baum an Baume nah steht,
          dort, wo die Blätter nur flüstern, das
          Eichhörnchen lebt.
          Sammy heißt es, ist flink und rot-braun,
          und trägt emsig Nüsse in seinen Bau.
        </p>
      </div>
      <button id="ar-button">🎯 Touch Your Dreams 🎯</button>
    </div>

    <!-- Back button for AR scene -->
    <button id="back-button">← Back to Story</button>

    <!-- Narrator and background music -->
    <audio id="narrator" src="./resources/narrator.mp3" preload="auto" playsinline></audio>
    <audio id="bg" src="./resources/ambient.mp3" preload="auto" playsinline loop></audio>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="char1" src="./resources/rig_anim3.glb"></a-asset-item>
        <a-asset-item id="char2" src="./resources/tree.glb"></a-asset-item>
      </a-assets>

      <a-camera id="camera1" position="0 0 0" look-controls="enabled: false "></a-camera>

      <!-- Marker (one image target) -->
      <a-entity id="marker1" mindar-image-target="targetIndex: 0">
        
        <a-gltf-model
          id="model1" 
          src="#char1"
          position="-0.2 -0.36 0"  
          rotation="0 75 0"
          scale="0.8 0.8 0.8"     
          animation="property: position; to: 0.1 -0.36 0; dur: 10000; easing: easeInOutQuad; loop: true"></a-gltf-model>
        ></a-gltf-model>

         <a-gltf-model
          id="model2"
          src="#char2"
          position="0.1 -0.35 0.2"
          rotation="0 310 0"
          scale="0.3 0.5 0.3"
        ></a-gltf-model>

      </a-entity>
    </a-scene>

  <script>
    const marker1 = document.querySelector("#marker1");
    const model1 = document.querySelector("#model1");
          
          
      marker1.addEventListener("targetFound", () => {
      model1.setAttribute("animation-mixer", "clip: *; loop: repeat; startAt: 0.04");
    });

    marker1.addEventListener("targetLost", () => {
    model1.removeAttribute("animation-mixer");
    });


    // Elements
      const welcomeBtn = document.getElementById('welcome-btn');
      const welcomeScreen = document.getElementById('welcome-screen');
      const content = document.getElementById('content');
      const arButton = document.getElementById('ar-button');
      const backButton = document.getElementById('back-button');
      const arScene = document.getElementById('ar-scene');
      const narrator = document.getElementById('narrator');
      const bg = document.getElementById('bg');
      const storyEl = document.getElementById('story');
     
      // Split story into words for GSAP animation
      const words = storyEl.innerText.trim().split(/\s+/);
      storyEl.innerHTML = '';
      words.forEach(word => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        storyEl.appendChild(span);
        storyEl.appendChild(document.createTextNode(' ')); // Add space after each word
      });

      // Simple fade-in animation
      const tl = gsap.timeline({ 
        onComplete: () => {
          // Show AR button after animation completes
          arButton.style.display = 'block';
        }
      });

      // Set initial state - invisible
      gsap.set('.word', { 
        opacity: 0
      });

      // Count words to calculate stagger time
      const wordCount = document.querySelectorAll('.word').length;
      const totalDuration = 12; // 12 seconds total
      const staggerTime = totalDuration / wordCount;

      tl.to('.word', {
        opacity: 1,
        duration: 0.5,
        stagger: staggerTime,
        ease: "power1.inOut"
      });
      
      tl.pause();

      // Handle welcome button click
      welcomeBtn.addEventListener('click', async () => {
        welcomeScreen.style.display = 'none';
        content.style.display = 'block';

        bg.volume = 0.08;
        narrator.volume = 1.0;

        try {
          await bg.play();
          await narrator.play();
        } catch(e) {
          console.log("Error starting audio:", e);
        }

        tl.restart();
      });

      // Handle AR button click
      arButton.addEventListener('click', () => {
        content.style.display = 'none';
        arScene.classList.add('active');
        backButton.style.display = 'block';
      });

      // Handle back button click
      backButton.addEventListener('click', () => {
        arScene.classList.remove('active');
        backButton.style.display = 'none';
        content.style.display = 'block';
      });

  </script>
  </body>
</html>
