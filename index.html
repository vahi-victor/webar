  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="char1" src="./assets/rig_anim2.glb"></a-asset-item>
      </a-assets>

      <a-camera id="camera1" position="0 -2 0" look-controls="enabled: true"></a-camera>

      <!-- Marker (one image target) -->
      <a-entity id="marker1" mindar-image-target="targetIndex: 0">
        
        <a-gltf-model
          id="model1" 
          src="#char1"
          position="-0.2 -0.36 0"  
          rotation="0 75 0"
          scale="1 1 1"     
           
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
const camera = document.querySelector("#camera1");

var a = 0;
  let smoothPos = new THREE.Vector3();
  let smoothRot = new THREE.Euler();
  const lerpFactor = 0.1; // smaller = smoother, slower response

  function update() {
            // targetPos = new THREE.Vector3();

    // MindAR updates model.object3D every frame automatically
    // const targetPos =
    const targetPos = camera.object3D.getWorldPosition(camera.object3D.position);
    const targetRot = camera.object3D.rotation.clone();

     if (a++ % 120 == 0)
         alert('a ' + targetPos.x + ' ' + targetPos.y + ' ' + targetPos.z);

// Smooth position
    smoothPos.lerp(targetPos, lerpFactor);

    camera.object3D.position.copy(smoothPos);

    // Smooth rotation
    smoothRot.x += (targetRot.x - smoothRot.x) * lerpFactor;
    smoothRot.y += (targetRot.y - smoothRot.y) * lerpFactor;
    smoothRot.z += (targetRot.z - smoothRot.z) * lerpFactor;
    camera.object3D.rotation.copy(smoothRot);

    requestAnimationFrame(update);
  }

  update(); // start smoothing loop
